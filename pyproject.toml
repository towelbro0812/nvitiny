[project]
name = "nvitiny"
version = "0.1.0"
description = "Narrow-terminal-first NVIDIA GPU monitor — renders down to 24 columns."
readme = "README.md"
authors = [
    { name = "towelbro0812", email = "towelbro910812@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "nvitop>=1.7.1",
    "rich>=15.0.0",
]

[project.scripts]
nvitiny = "nvitiny.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
